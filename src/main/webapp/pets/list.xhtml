<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="content">
        <h1>Pets#{petBean.selectedOwnerId != null ? ' for Owner' : ''}</h1>

        <h:link outcome="/owners/list" styleClass="back-link" rendered="#{petBean.selectedOwnerId != null}">← Back to Owners</h:link>

        <!-- Pet list -->
        <h:dataTable value="#{petBean.pets}" var="p" styleClass="table" headerClass="table-header"
                     rowClasses="row-even,row-odd" rendered="#{not empty petBean.pets}">
            <h:column><f:facet name="header">Name</f:facet>#{p.name}</h:column>
            <h:column><f:facet name="header">Type</f:facet>#{p.type.name}</h:column>
            <h:column><f:facet name="header">Birth Date</f:facet>#{p.birthDate}</h:column>
            <h:column><f:facet name="header">Owner</f:facet>#{p.owner.fullName}</h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:form>
                    <h:commandButton value="Edit" action="#{petBean.prepareEdit(p.id)}" styleClass="btn btn-sm"/>
                    <h:commandButton value="Delete" action="#{petBean.delete(p.id)}" styleClass="btn btn-danger btn-sm"
                                     onclick="return confirm('Delete #{p.name}?')"/>
                    <h:link outcome="/visits/list" styleClass="btn btn-sm btn-info">
                        <f:param name="petId" value="#{p.id}"/>Visits
                    </h:link>
                </h:form>
            </h:column>
        </h:dataTable>

        <p class="empty-msg" rendered="#{empty petBean.pets}">No pets found.</p>

        <!-- Add/Edit form -->
        <div id="pet-form" class="form-section">
            <h2>#{petBean.pet.id == null ? 'Add New Pet' : 'Edit Pet'}</h2>
            <h:form>
                <f:viewParam name="ownerId" value="#{petBean.selectedOwnerId}"/>
                <div class="form-grid">
                    <label>Name</label>
                    <h:inputText value="#{petBean.pet.name}" required="true" styleClass="input"/>

                    <label>Birth Date (YYYY-MM-DD)</label>
                    <h:inputText value="#{petBean.pet.birthDate}" required="true" styleClass="input">
                        <f:convertDateTime pattern="yyyy-MM-dd" type="localDate"/>
                    </h:inputText>

                    <label>Type</label>
                    <h:selectOneMenu value="#{petBean.pet.type}" required="true" styleClass="input">
                        <f:selectItems value="#{petBean.petTypes}" var="t" itemLabel="#{t.name}" itemValue="#{t}"/>
                        <f:converter converterId="jakarta.faces.Object"/>
                    </h:selectOneMenu>

                    <label rendered="#{petBean.selectedOwnerId == null}">Owner</label>
                    <h:selectOneMenu value="#{petBean.pet.owner}" required="true" styleClass="input"
                                     rendered="#{petBean.selectedOwnerId == null}">
                        <f:selectItems value="#{petBean.allOwners}" var="o" itemLabel="#{o.fullName}" itemValue="#{o}"/>
                        <f:converter converterId="jakarta.faces.Object"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-actions">
                    <h:commandButton value="Save" action="#{petBean.save}" styleClass="btn btn-primary"/>
                    <h:commandButton value="Cancel" action="#{petBean.resetForm}" immediate="true" styleClass="btn btn-secondary"/>
                </div>
                <h:messages styleClass="field-errors"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
</html>
