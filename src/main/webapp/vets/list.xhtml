<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="content">
        <h1>Veterinarians</h1>

        <h:dataTable value="#{vetBean.vets}" var="v" styleClass="table" headerClass="table-header"
                     rowClasses="row-even,row-odd" rendered="#{not empty vetBean.vets}">
            <h:column><f:facet name="header">Name</f:facet>#{v.fullName}</h:column>
            <h:column>
                <f:facet name="header">Specialties</f:facet>
                <ui:repeat value="#{v.specialties}" var="s" varStatus="st">
                    <span class="badge">#{s.name}</span>
                </ui:repeat>
                <span rendered="#{empty v.specialties}" class="badge badge-none">none</span>
            </h:column>
        </h:dataTable>

        <p class="empty-msg" rendered="#{empty vetBean.vets}">No vets found.</p>
    </ui:define>
</ui:composition>
</html>
